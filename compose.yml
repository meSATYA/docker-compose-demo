services:
  nginx:                       # the only service exposed to the outside world
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - frontend

  web:                         # Flask API, no published port -> scalable
    build: ./app
    environment:
      REDIS_HOST: redis
    volumes:
      - ./app:/app             # bind mount: edit code, see it live
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  redis:                       # data store, reachable only from the backend network
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data       # named volume: survives container removal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  redis-data:
