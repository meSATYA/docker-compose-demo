AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ECS Fargate stack for the Flask API, Nginx ingress, and persistent single-node Redis.
  Deploy in ap-southeast-2 to use the supplied ECR image URI.

Parameters:
  AppImage:
    Type: String
    Default: 018096903795.dkr.ecr.ap-southeast-2.amazonaws.com/diy-py-app:latest
    Description: Flask application image. Prefer an immutable image tag for production.
  WebDesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Number of Flask API tasks; each task is independently scalable.
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.40.0.0/20
  PublicSubnetBCidr:
    Type: String
    Default: 10.40.16.0/20

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-a'
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-b'
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: app.local
      Vpc: !Ref VPC
      Description: Private DNS names for ECS services

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP listener on port 8080
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
  NginxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nginx accepts traffic only from the ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Flask accepts traffic only from Nginx tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref NginxSecurityGroup
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis accepts traffic only from Flask tasks and EFS mounts
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref WebSecurityGroup
  RedisEfsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RedisSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref RedisSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
  NginxTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      TargetType: ip
      Protocol: HTTP
      Port: 80
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      Matcher:
        HttpCode: '200'
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NginxTargetGroup

  RedisFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-redis-data'
  RedisAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref RedisFileSystem
      PosixUser:
        Uid: '999'
        Gid: '1000'
      RootDirectory:
        Path: /redis
        CreationInfo:
          OwnerUid: '999'
          OwnerGid: '1000'
          Permissions: '0755'
  EfsMountTargetA:
    Type: AWS::EFS::MountTarget
    DependsOn: RedisEfsIngress
    Properties:
      FileSystemId: !Ref RedisFileSystem
      SubnetId: !Ref PublicSubnetA
      SecurityGroups: [!Ref RedisSecurityGroup]
  EfsMountTargetB:
    Type: AWS::EFS::MountTarget
    DependsOn: RedisEfsIngress
    Properties:
      FileSystemId: !Ref RedisFileSystem
      SubnetId: !Ref PublicSubnetB
      SecurityGroups: [!Ref RedisSecurityGroup]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/nginx'
      RetentionInDays: 30
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/web'
      RetentionInDays: 30
  RedisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/redis'
      RetentionInDays: 30

  WebDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: web
      NamespaceId: !GetAtt Namespace.Id
      DnsConfig:
        NamespaceId: !GetAtt Namespace.Id
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
  RedisDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: redis
      NamespaceId: !GetAtt Namespace.Id
      DnsConfig:
        NamespaceId: !GetAtt Namespace.Id
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  NginxTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-nginx'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: nginx
          Image: nginx:1.30-alpine
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          Command:
            - sh
            - -c
            - |
              cat > /etc/nginx/conf.d/default.conf <<'NGINXCONF'
              server {
                listen 80;
                resolver 169.254.169.253 ipv6=off valid=10s;
                location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
                location / {
                  set $backend web.app.local:5000;
                  proxy_pass http://$backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                }
              }
              NGINXCONF
              exec nginx -g 'daemon off;'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref NginxLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-web'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: web
          Image: !Ref AppImage
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: REDIS_HOST
              Value: redis.app.local
            - Name: REDIS_PORT
              Value: '6379'
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'python -c ''import socket; s=socket.create_connection(("127.0.0.1", 5000), 3); s.close()'''
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
  RedisTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - EfsMountTargetA
      - EfsMountTargetB
    Properties:
      Family: !Sub '${AWS::StackName}-redis'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      Volumes:
        - Name: redis-data
          EfsVolumeConfiguration:
            FileSystemId: !Ref RedisFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref RedisAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: redis
          Image: redis:7-alpine
          Essential: true
          Command: [redis-server, --appendonly, 'yes']
          PortMappings:
            - ContainerPort: 6379
              Protocol: tcp
          MountPoints:
            - SourceVolume: redis-data
              ContainerPath: /data
              ReadOnly: false
          HealthCheck:
            Command: [CMD, redis-cli, ping]
            Interval: 5
            Timeout: 3
            Retries: 5
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RedisLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  NginxService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: nginx
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 2
      PlatformVersion: LATEST
      TaskDefinition: !Ref NginxTaskDefinition
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref NginxSecurityGroup]
      LoadBalancers:
        - ContainerName: nginx
          ContainerPort: 80
          TargetGroupArn: !Ref NginxTargetGroup
  WebService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref WebDesiredCount
      PlatformVersion: LATEST
      TaskDefinition: !Ref WebTaskDefinition
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref WebSecurityGroup]
      ServiceRegistries:
        - RegistryArn: !GetAtt WebDiscovery.Arn
  RedisService:
    Type: AWS::ECS::Service
    DependsOn:
      - EfsMountTargetA
      - EfsMountTargetB
    Properties:
      ServiceName: redis
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      PlatformVersion: LATEST
      TaskDefinition: !Ref RedisTaskDefinition
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref RedisSecurityGroup]
      ServiceRegistries:
        - RegistryArn: !GetAtt RedisDiscovery.Arn

Outputs:
  ClusterName:
    Description: ECS cluster name
    Value: !Ref Cluster
  ApplicationUrl:
    Description: HTTP endpoint on port 8080
    Value: !Sub 'http://${LoadBalancer.DNSName}:8080'
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  WebServiceName:
    Value: !GetAtt WebService.Name
  RedisDataFileSystemId:
    Value: !Ref RedisFileSystem
